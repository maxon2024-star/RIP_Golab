<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диапазоны излучения - Фотоэффект</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-container">
    <header class="main-header">
        <h1 class="app-title">⚡ Фотоэффект</h1>
    </header>

    <div class="sub-header">
        <form action="/" method="GET" class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" name="search" placeholder="Поиск диапазонов излучения..." value="{{.search}}" class="search-input">
        </form>

        {{if gt .draft_id 0}}
        <a href="/radiation_calculation/{{.draft_id}}" class="cart-icon" title="Заявка">
            🛒<span class="cart-count">{{.count}}</span>
        </a>
        {{else}}
        <a href="#" class="cart-icon" title="Корзина пуста">🛒</a>
        {{end}}
    </div>

    <main class="main-content">
        <h2 class="section-title">Диапазоны электромагнитного излучения</h2>

        <div class="services-grid">
            {{range .services}}
            <div class="service-card">
                <div class="card-image-wrapper">
                    <img src="{{.ImageURL}}" alt="{{.Name}}" class="card-image" onerror="this.src='https://via.placeholder.com/400x250?text=No+Image'">
                    <div class="badge-description">{{.Description}}</div>
                    <div class="card-overlay">
                        <a href="/service/{{.ID}}" class="btn-details">👁️ Подробнее</a>
                    </div>
                </div>

                <div class="card-info">
                    <h3 class="card-title">{{.Name}}</h3>
                    <div class="card-specs">
                        <div class="spec-item">
                            <span class="spec-icon" style="color:var(--primary)">⚡</span>
                            <div class="badge-description">{{.Description}}</div>                        </div>
                    </div>

                    <form action="/add-to-calculation" method="POST">
                        <input type="hidden" name="service_id" value="{{.ID}}">
                        <button type="submit" class="btn-add">➕ В заявку</button>
                    </form>
                </div>
            </div>
            {{end}}
        </div>
    </main>
</div>
</body>
</html>
