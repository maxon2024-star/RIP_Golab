<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диапазоны излучения - Фотоэффект</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="app-container">
    <!-- Header -->
    <header class="main-header">
        <div class="header-top">
            <h1 class="app-title">⚡ Фотоэффект</h1>
            <div class="header-actions">
                <a href="/request" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cart-count">{{.count}}</span>
                </a>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" placeholder="Поиск диапазона излучения...">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="services-container">
        <h2 class="section-title">Диапазоны электромагнитного излучения</h2>
        <div class="services-grid">
            {{range .services}}
            <div class="product-card">
                <div class="product-image-wrapper">
                    <img src="{{.ImageURL}}" alt="{{.Name}}" class="product-image">
                    <div class="product-overlay">
                        <button class="quick-view-btn" onclick="viewDetails({{.ID}})">
                            <i class="fas fa-eye"></i>
                            <span>Подробнее</span>
                        </button>
                    </div>
                </div>

                <div class="product-info">
                    <h3 class="product-name">{{.Name}}</h3>
                    <div class="product-specs">
                        <div class="spec-item">
                            <i class="fas fa-wave-square"></i>
                            <span>{{.Wavelength}}</span>
                        </div>
                        <div class="spec-item">
                            <i class="fas fa-bolt"></i>
                            <span>{{.EnergyRange}}</span>
                        </div>
                        <div class="spec-item">
                            <i class="fas fa-broadcast-tower"></i>
                            <span>{{.Frequency}}</span>
                        </div>
                    </div>

                    <div class="product-actions">
                        <button class="add-btn" id="add-btn-{{.ID}}" onclick="addToRequest({{.ID}}, this)">
                            <i class="fas fa-plus"></i>
                            <span>В заявку</span>
                        </button>
                    </div>
                </div>
            </div>
            {{end}}
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Главная</span>
        </a>
        <a href="/request" class="nav-item">
            <i class="fas fa-file-alt"></i>
            <span>Заявка</span>
        </a>
<!--        <a href="#" class="nav-item">-->
<!--            <i class="fas fa-user"></i>-->
<!--            <span>Профиль</span>-->
<!--        </a>-->
    </nav>
</div>

<script>
    async function addToRequest(serviceId, button) {
        const response = await fetch('/add-to-request', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                service_id: serviceId,
                quantity: 1,
                area: 10,
                work_function: 2.3,
                efficiency: 18,
                comment: '',
                result: '0.0 мА',
                order: 1
            })
        });

        if (response.ok) {
            const data = await response.json();
            document.getElementById('cart-count').textContent = data.count;

            // Обновляем кнопку
            button.classList.add('added');
            button.innerHTML = '<i class="fas fa-check"></i><span>В заявке</span>';

            setTimeout(() => {
                button.classList.remove('added');
                button.innerHTML = '<i class="fas fa-plus"></i><span>В заявку</span>';
            }, 2000);
        }
    }

    function viewDetails(serviceId) {
        window.location.href = `/service/${serviceId}`;
    }

    // Search functionality
    document.querySelector('.search-input').addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase();
        document.querySelectorAll('.product-card').forEach(card => {
            const name = card.querySelector('.product-name').textContent.toLowerCase();
            card.style.display = name.includes(searchTerm) ? 'block' : 'none';
        });
    });
</script>
</body>
</html>
