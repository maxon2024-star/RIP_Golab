<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.service.Name}} - Фотоэффект</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-container">
    <header class="main-header">
        <h1 class="app-title">⚡ Фотоэффект</h1>
    </header>

    <div class="sub-header">
        <a href="/" class="btn-details">⬅ Назад к списку</a>

        {{if gt .draft_id 0}}
        <a href="/radiation_calculation/{{.draft_id}}" class="cart-icon" title="Заявка">
            🛒<span class="cart-count">{{.count}}</span>
        </a>
        {{else}}
        <a href="#" class="cart-icon" title="Корзина пуста">🛒</a>
        {{end}}
    </div>

    <main class="main-content">
        <div class="detail-container-vibes">
            <div class="vibes-layout">

                <div class="vibes-video-section">
                    <video autoplay loop muted playsinline class="tiktok-video">
                        <source src="{{.videoURL}}" type="video/mp4">
                    </video>
                    <div class="vibes-video-overlay">
                        <h2 style="font-size:1.8rem; margin-bottom:8px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);">{{.service.Name}}</h2>
                        <p style="font-size:0.9rem; margin-bottom:8px;">{{.service.Description}}</p>
                        <p style="font-size:0.8rem; opacity:0.8;">Энергия: {{.service.EnergyRange}} | Частота: {{.service.Frequency}}</p>
                    </div>
                </div>

                <div class="vibes-form-section">
                    <h2 style="color:var(--primary); margin-bottom:20px;">Параметры эксперимента</h2>
                    <form action="/add-to-calculation" method="POST">
                        <input type="hidden" name="service_id" value="{{.service.ID}}">

                        <div class="form-field">
                            <label>Площадь катода (см²)</label>
                            <input type="number" name="area" value="10" min="0.1" step="0.1" required>
                        </div>

                        <div class="form-field">
                            <label>Квантовая эффективность (%)</label>
                            <input type="number" name="efficiency" value="18" min="0" max="100" step="0.1" required>
                        </div>

                        <div class="form-field">
                            <label>Частота (Гц)</label>
                            <input type="number" name="frequency" step="any" placeholder="По умолчанию (из каталога)">
                        </div>

                        <!-- НОВОЕ: Работа выхода -->
                        <div class="form-field">
                            <label>Работа выхода (эВ)</label>
                            <input type="number" name="work_function" value="2.0" step="any" min="0" required>
                        </div>

                        <button type="submit" class="electric-btn" style="margin-top: 15px; width: 100%;">➕ Добавить в заявку</button>
                    </form>
                </div>

            </div>
        </div>
    </main>
</div>
</body>
</html>
