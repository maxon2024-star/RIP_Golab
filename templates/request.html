<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заявка - Расчет фотоэффекта</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📋 Заявка на расчет фотоэффекта</h1>
        <p>Расчет тока фотоэффекта от распределения излучения по диапазонам</p>
        <a href="/" class="back-btn">← Назад к диапазонам</a>
    </div>

    <div class="stats">
        <div class="stat-card">
            <span>Количество диапазонов</span>
            <h2 id="count">0</h2>
        </div>
        <div class="stat-card green">
            <span>Общий ток фотоэффекта</span>
            <h2 id="totalCurrent">0 мА</h2>
        </div>
    </div>

    <h2 class="section-title">📦 Состав заявки на эксперимент</h2>

    <div id="cart"></div>

    <div class="total-box">
        <h3>Суммарный ток фотоэлектронов:</h3>
        <div id="finalTotal">0 мА</div>
        <button class="submit-btn">📤 Отправить расчет</button>
    </div>
</div>

<script>
    let radiationRanges = [];

    async function loadRequest() {
        const response = await fetch('/request');
        if (response.ok) {
            const html = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');

            const itemsData = doc.querySelector('#items-data');
            if (itemsData) {
                radiationRanges = JSON.parse(itemsData.textContent);
                render();
            }
        }
    }

    function render() {
        const cart = document.getElementById("cart");
        cart.innerHTML = "";

        let totalCurrent = 0;

        radiationRanges.forEach(range => {
            const current = calculatePhotoCurrent(range);
            range.current = current;
            totalCurrent += current;

            cart.innerHTML += `
                <div class="card" style="border-color:${range.color}">
                    <div class="card-header" style="background:${range.color}">
                        <h3>${range.name}</h3>
                        <button class="remove-btn" onclick="removeRange(${range.service_id})">×</button>
                    </div>
                    <div class="card-body">
                        <div class="controls-grid">
                            <div class="control-group">
                                <label>Частота излучения</label>
                                <input type="text" value="${range.frequency}" disabled>
                            </div>
                            <div class="control-group">
                                <label>Энергия фотонов (эВ)</label>
                                <input type="text" value="${range.energy_range}" disabled>
                            </div>
                            <div class="control-group">
                                <label>Интенсивность потока (Вт/м²)</label>
                                <input type="number" value="${range.intensity}" min="0" step="0.1"
                                       onchange="updateRange(${range.service_id}, 'intensity', this.value)">
                            </div>
                            <div class="control-group">
                                <label>Площадь катода (см²)</label>
                                <input type="number" value="${range.area}" min="0.1" step="0.1"
                                       onchange="updateRange(${range.service_id}, 'area', this.value)">
                            </div>
                            <div class="control-group">
                                <label>Работа выхода (эВ)</label>
                                <input type="number" value="${range.work_function}" min="0.1" step="0.1"
                                       onchange="updateRange(${range.service_id}, 'work_function', this.value)">
                            </div>
                            <div class="control-group">
                                <label>Квантовая эффективность (%)</label>
                                <input type="number" value="${range.efficiency}" min="0" max="100" step="0.1"
                                       onchange="updateRange(${range.service_id}, 'efficiency', this.value)">
                            </div>
                            <div class="control-group">
                                <label>Описание эксперимента</label>
                                <input type="text" value="${range.comment}" placeholder="Параметры опыта..."
                                       onchange="updateRange(${range.service_id}, 'comment', this.value)">
                            </div>
                        </div>

                        <div class="result-section">
                            <div class="result">
                                Ток фотоэффекта: <span class="result-value">${current.toFixed(2)} мА</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });

        document.getElementById("count").innerText = radiationRanges.length;
        document.getElementById("totalCurrent").innerText = totalCurrent.toFixed(2) + " мА";
        document.getElementById("finalTotal").innerText = totalCurrent.toFixed(2) + " мА";
    }

    async function removeRange(serviceId) {
        const response = await fetch('/remove-from-request', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                service_id: serviceId
            })
        });

        if (response.ok) {
            radiationRanges = radiationRanges.filter(r => r.service_id !== serviceId);
            render();
        }
    }

    async function updateRange(serviceId, property, value) {
        const rangeIndex = radiationRanges.findIndex(r => r.service_id === serviceId);
        if (rangeIndex !== -1) {
            radiationRanges[rangeIndex][property] = parseFloat(value) || value;

            const response = await fetch('/update-request', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(radiationRanges[rangeIndex])
            });

            if (response.ok) {
                render();
            }
        }
    }

    function calculatePhotoCurrent(range) {
        // Формула тока фотоэффекта: I = η * e * P / (h * ν)
        // Упрощенная модель для демонстрации
        const baseCurrent = range.intensity * range.area * range.efficiency / 1000;
        return baseCurrent;
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetch('/request')
            .then(response => response.json())
            .then(data => {
                radiationRanges = data.items || [];
                render();
            })
            .catch(() => {
                radiationRanges = [];
                render();
            });
    });
</script>

</body>
</html>
